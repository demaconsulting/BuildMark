---
# AzureDevOpsConnectorConfig unit requirements

sections:
  - title: BuildMark Requirements
    sections:
      - title: Configuration Requirements
        sections:
          - title: AzureDevOpsConnectorConfig Requirements
            requirements:
              - id: BuildMark-AzureDevOpsConnectorConfig-Properties
                title: >-
                  AzureDevOpsConnectorConfig shall expose OrganizationUrl, Organization, Project, and
                  Repository properties that override the corresponding auto-detected
                  values in AzureDevOpsRepoConnector.
                justification: |
                  Teams using Azure DevOps where auto-detection from the Git remote URL is
                  unreliable need a way to specify the organization URL, optional organization
                  name, project, and repository name explicitly in the configuration file.
                tests:
                  - BuildMarkConfigReader_ReadAsync_ValidAzureDevOpsConnector_ReturnsParsedConfiguration

              - id: BuildMark-AzureDevOpsConnectorConfig-TokenVariable
                title: >-
                  AzureDevOpsConnectorConfig shall expose a TokenVariable property that specifies
                  the name of the environment variable holding the Azure DevOps access token.
                justification: |
                  Teams that store their Azure DevOps access token in a non-standard environment
                  variable need a way to tell the connector which variable to read. When TokenVariable
                  is set, the connector must use only that variable and must not fall back to well-known
                  names or the az CLI, so that the operator retains full control over credential sourcing.
                tests:
                  - AzureDevOpsRepoConnector_GetBuildInformationAsync_WithTokenVariable_UsesCustomVariable
                  - AzureDevOpsRepoConnector_GetBuildInformationAsync_WithTokenVariable_EmptyValue_ThrowsInvalidOperationException
                  - AzureDevOpsRepoConnector_GetBuildInformationAsync_WithTokenVariable_NotSet_ThrowsInvalidOperationException
