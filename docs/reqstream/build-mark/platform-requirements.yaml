---
# BuildMark platform requirements
sections:
  - title: BuildMark Requirements
    sections:
      - title: Platform Support
        requirements:
          - id: BuildMark-Plt-Windows
            title: The tool shall run on Windows operating systems.
            tags:
              - system
            justification: |
              Windows support is essential for .NET developers working in Windows-centric
              environments, including enterprise settings and teams using Visual Studio. This
              ensures BuildMark serves the full spectrum of .NET development scenarios.
            # Test source pattern "windows@" ensures these tests ran on Windows.
            # This filtering is necessary to prove Windows OS functionality.
            tests:
              - windows@BuildMark_VersionFlag_OutputsVersion
              - windows@BuildMark_HelpFlag_OutputsUsageInformation
              - windows@BuildMark_ReportParameter_IsAccepted
              - windows@BuildMark_MarkdownReportGeneration
              - windows@BuildMark_GitIntegration
              - windows@BuildMark_IssueTracking
              - windows@BuildMark_KnownIssuesReporting

          - id: BuildMark-Plt-Linux
            title: The tool shall run on Linux operating systems.
            tags:
              - system
            justification: |
              Linux support is critical for modern DevOps practices and cloud-native development
              where Linux-based CI/CD systems and containerized environments dominate. This
              ensures BuildMark works seamlessly in contemporary .NET deployment scenarios.
            # Test source pattern "ubuntu@" ensures these tests ran on Linux.
            # This filtering is necessary to prove Linux OS functionality.
            tests:
              - ubuntu@BuildMark_VersionFlag_OutputsVersion
              - ubuntu@BuildMark_HelpFlag_OutputsUsageInformation
              - ubuntu@BuildMark_ReportParameter_IsAccepted
              - ubuntu@BuildMark_MarkdownReportGeneration
              - ubuntu@BuildMark_GitIntegration
              - ubuntu@BuildMark_IssueTracking
              - ubuntu@BuildMark_KnownIssuesReporting

          - id: BuildMark-Plt-MacOS
            title: The tool shall run on macOS operating systems.
            tags:
              - system
            justification: |
              macOS support is essential for developers working on Apple platforms. This ensures
              BuildMark serves the full spectrum of .NET development scenarios including macOS-based
              CI/CD agents and developer workstations.
            # Test source pattern "macos@" ensures these tests ran on macOS.
            # This filtering is necessary to prove macOS functionality.
            tests:
              - macos@BuildMark_VersionFlag_OutputsVersion
              - macos@BuildMark_HelpFlag_OutputsUsageInformation
              - macos@BuildMark_ReportParameter_IsAccepted
              - macos@BuildMark_MarkdownReportGeneration
              - macos@BuildMark_GitIntegration
              - macos@BuildMark_IssueTracking
              - macos@BuildMark_KnownIssuesReporting

          - id: BuildMark-Plt-Net10
            title: The tool shall support .NET 10.0 runtime.
            tags:
              - system
            justification: |
              .NET 10.0 is a Long-Term Support (LTS) release and the oldest supported .NET
              runtime. Supporting this version ensures BuildMark remains usable for organizations
              following Microsoft's LTS support lifecycle and requiring stability guarantees.
            # Test source pattern "dotnet10.x@" ensures these tests ran on .NET 10.0.
            # This filtering is necessary to prove .NET 10.0 runtime support.
            tests:
              - dotnet10.x@BuildMark_MarkdownReportGeneration
              - dotnet10.x@BuildMark_GitIntegration
              - dotnet10.x@BuildMark_IssueTracking
              - dotnet10.x@BuildMark_KnownIssuesReporting

          - id: BuildMark-Plt-Net11
            title: The tool shall support .NET 11.0 runtime.
            tags:
              - system
            justification: |
              .NET 11.0 is the latest .NET release. Supporting this version provides users access
              to the latest .NET features and performance improvements for teams who adopt newer
              releases.
            # Test source pattern "dotnet11.x@" ensures these tests ran on .NET 11.0.
            # This filtering is necessary to prove .NET 11.0 runtime support.
            tests:
              - dotnet11.x@BuildMark_MarkdownReportGeneration
              - dotnet11.x@BuildMark_GitIntegration
              - dotnet11.x@BuildMark_IssueTracking
              - dotnet11.x@BuildMark_KnownIssuesReporting
