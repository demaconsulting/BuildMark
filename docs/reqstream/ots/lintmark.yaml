---
# LintMark OTS Software Requirements
#
# Requirements for the LintMark Markdown linting tool functionality.

sections:
  - title: OTS Software Requirements
    sections:
      - title: LintMark Requirements
        requirements:
          - id: BuildMark-OTS-LintMark
            title: LintMark shall start in the build environment and report its version and usage.
            justification: |
              DemaConsulting.LintMark is restored from .config/dotnet-tools.json and run by
              lint.ps1 and fix.ps1. Its self-validation checks the version and help output, which
              proves that the pinned tool starts in the build environment.
            tags: [ots]
            tests:
              - LintMark_VersionDisplay
              - LintMark_HelpDisplay

          - id: BuildMark-OTS-LintMark-RuleViolations
            title: >-
              LintMark shall report each violation of the rules configured in .lintmark.yaml and exit
              with a non-zero code, while passing a conforming file.
            justification: |
              lint.ps1 relies on LintMark failing the quality-checks job when a Markdown file breaks
              a rule configured in .lintmark.yaml. Its self-validation checks that a conforming file
              produces no findings, that violations are reported with a non-zero exit code, and that
              rule settings from the configuration file are honored.
            tags: [ots]
            tests:
              - LintMark_CleanFileNoFindings
              - LintMark_ViolationsReported
              - LintMark_ConfigurationHonored

          - id: BuildMark-OTS-LintMark-Fix
            title: LintMark shall rewrite fixable rule violations in a Markdown file to the canonical form.
            justification: |
              fix.ps1 runs `lintmark --fix` so that developers can bring Markdown files into
              conformance before the lint gate checks them. Its self-validation checks that the fix
              mode rewrites a file with violations to the canonical form.
            tags: [ots]
            tests:
              - LintMark_FixRewritesToCanonicalForm
