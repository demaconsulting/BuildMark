<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <!-- The README hero banner. Version tags, pull requests, GitHub issues, and Azure DevOps work items flow into the
       buildmark tool, and come out as Markdown build notes, a Pandoc PDF, release notes, and a CI pipeline artifact.
       The definitions and the left panel follow the shared DEMA Consulting hero (CanvasNet docs/images/hero). -->
  <defs>
    <style>
      .word { font: bold 92px sans-serif; fill: #ffffff; }
      .eyebrow { font: bold 25px sans-serif; fill: #a5b4fc; }
      .tag { font: bold 36px sans-serif; fill: #f8fafc; }
      .body { font: 25px sans-serif; fill: #cbd5e1; }
      .cmd { font: 25px monospace; fill: #e2e8f0; }
      .prompt { fill: #5eead4; }
      .file { fill: #f9a8d4; }
      .brandText { fill: url(#brand); }
      .note { font: italic 25px sans-serif; fill: #94a3b8; }
      .label { font: bold 25px sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .engine { font: bold 32px monospace; fill: #ffffff; }
      .api { font: bold 25px sans-serif; fill: #c4b5fd; }
      .card { fill: url(#glass); stroke: url(#rim); stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #0a1022; stroke: #ffffff; stroke-opacity: 0.06; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="engineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="heat" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <marker id="headPink" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#f472b6"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#fbbf24"/>
    </marker>
    <marker id="headCyan" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#22d3ee"/>
    </marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#a78bfa"/>
    </marker>
    <marker id="headBlue" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#60a5fa"/>
    </marker>
    <marker id="headMint" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#5eead4"/>
    </marker>

    <!-- BuildMark additions: the text and shapes inside the mini illustrations -->
    <style>
      .mini { font: bold 22px sans-serif; }
      .miniMono { font: bold 22px monospace; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
    </style>
  </defs>

  <!-- Background: deep gradient, soft glows, and a dot grid -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <ellipse cx="250" cy="170" rx="420" ry="300" fill="url(#glowViolet)"/>
  <ellipse cx="1070" cy="294" rx="420" ry="220" fill="url(#glowCyan)"/>
  <ellipse cx="1480" cy="620" rx="380" ry="260" fill="url(#glowPink)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- Wordmark and tagline -->
  <image href="hero/dc-logo-dark.svg" x="46" y="54" width="50" height="50"/>
  <text class="eyebrow" x="100" y="90">DEMA Consulting</text>
  <text class="word" x="52" y="176">Build</text>
  <text class="word brandText" x="281.9" y="176">Mark</text>
  <rect x="58" y="200" width="132" height="6" rx="3" fill="url(#brand)"/>
  <text class="tag" x="56" y="266">Markdown build notes from</text>
  <text class="tag" x="56" y="314" style="fill: #a5b4fc">GitHub or Azure DevOps.</text>
  <text class="body" x="58" y="368">Reads version tags, pull requests and</text>
  <text class="body" x="58" y="402">issues; writes the changes, bugs fixed</text>
  <text class="body" x="58" y="436">and known issues between two versions.</text>
  <rect x="56" y="468" width="480" height="90" rx="12" fill="#0a1022" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
  <text class="cmd prompt" x="78" y="503">$</text>
  <text class="cmd" x="108" y="503">buildmark --report</text>
  <text class="cmd file" x="393" y="503">notes.md</text>
  <text class="cmd" x="138" y="539">--build-version</text>
  <text class="cmd file" x="378" y="539">v1.2.3</text>
  <text class="note" x="58" y="604">.NET 10 and 11 &#183; Windows, Linux, macOS</text>

  <!-- Input cards -->
  <g>
    <!-- Version tags: the commits between the previous tag and this one -->
    <rect class="card" x="580" y="40" width="196" height="160" rx="16"/>
    <rect x="622" y="40" width="112" height="3" rx="1.5" fill="#fbbf24"/>
    <rect class="panel" x="588" y="48" width="180" height="112" rx="10"/>
    <line x1="600" y1="134" x2="756" y2="134" stroke="#64748b" stroke-width="3"/>
    <line x1="636" y1="134" x2="720" y2="134" stroke="#fbbf24" stroke-width="5"/>
    <line x1="636" y1="94" x2="636" y2="128" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="720" y1="94" x2="720" y2="128" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
    <g stroke="#0a1022" stroke-width="2">
      <circle cx="608" cy="134" r="5" fill="#94a3b8"/>
      <circle cx="636" cy="134" r="6" fill="#fbbf24"/>
      <circle cx="664" cy="134" r="5" fill="#fbbf24"/>
      <circle cx="692" cy="134" r="5" fill="#fbbf24"/>
      <circle cx="720" cy="134" r="6" fill="#fbbf24"/>
      <circle cx="748" cy="134" r="5" fill="#94a3b8"/>
    </g>
    <rect x="602" y="62" width="68" height="32" rx="7" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.5"/>
    <text class="mini" x="636" y="86" fill="#fde68a" text-anchor="middle">v1.1</text>
    <rect x="686" y="62" width="68" height="32" rx="7" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.5"/>
    <text class="mini" x="720" y="86" fill="#fde68a" text-anchor="middle">v1.2</text>
    <text class="label" x="678" y="190">Version tags</text>

    <!-- Pull requests: a branch merged back into main -->
    <rect class="card" x="788" y="40" width="196" height="160" rx="16"/>
    <rect x="830" y="40" width="112" height="3" rx="1.5" fill="#22d3ee"/>
    <rect class="panel" x="796" y="48" width="180" height="112" rx="10"/>
    <line x1="808" y1="138" x2="964" y2="138" stroke="#64748b" stroke-width="3"/>
    <path d="M824,138 C844,138 842,106 862,106 L910,106 C930,106 930,138 950,138" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <g stroke="#0a1022" stroke-width="2">
      <circle cx="824" cy="138" r="5" fill="#94a3b8"/>
      <circle cx="862" cy="106" r="5" fill="#22d3ee"/>
      <circle cx="910" cy="106" r="5" fill="#22d3ee"/>
      <circle cx="950" cy="138" r="7" fill="#22d3ee"/>
    </g>
    <rect x="851" y="58" width="70" height="32" rx="16" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.5"/>
    <text class="mini" x="886" y="82" fill="#a5f3fc" text-anchor="middle">#42</text>
    <text class="label" x="886" y="190">Pull requests</text>

    <!-- GitHub issues: open, bug, and closed -->
    <rect class="card" x="996" y="40" width="196" height="160" rx="16"/>
    <rect x="1038" y="40" width="112" height="3" rx="1.5" fill="#f472b6"/>
    <rect class="panel" x="1004" y="48" width="180" height="112" rx="10"/>
    <circle cx="1026" cy="72" r="8" fill="none" stroke="#4ade80" stroke-width="3"/>
    <circle cx="1026" cy="72" r="2.5" fill="#4ade80"/>
    <rect class="bar" x="1044" y="68" width="122" height="8" rx="4" fill-opacity="0.75"/>
    <circle cx="1026" cy="104" r="8" fill="none" stroke="#f472b6" stroke-width="3"/>
    <circle cx="1026" cy="104" r="2.5" fill="#f472b6"/>
    <rect class="bar" x="1044" y="100" width="58" height="8" rx="4" fill-opacity="0.75"/>
    <rect x="1110" y="90" width="56" height="28" rx="14" fill="#f472b6" fill-opacity="0.2" stroke="#f472b6" stroke-width="1.5"/>
    <text class="mini" x="1138" y="112" fill="#fbcfe8" text-anchor="middle">bug</text>
    <circle cx="1026" cy="136" r="9" fill="#a78bfa"/>
    <path d="M1021.5 136 L1025 139.5 L1031 132.5" fill="none" stroke="#0a1022" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="bar" x="1044" y="132" width="100" height="8" rx="4" fill-opacity="0.75"/>
    <text class="label" x="1094" y="190">GitHub issues</text>

    <!-- Azure DevOps work items: a board of stories, bugs, and tasks -->
    <rect class="card" x="1204" y="40" width="356" height="160" rx="16"/>
    <rect x="1302" y="40" width="160" height="3" rx="1.5" fill="#60a5fa"/>
    <rect class="panel" x="1212" y="48" width="340" height="112" rx="10"/>
    <g fill="#ffffff" fill-opacity="0.06">
      <rect x="1224" y="58" width="100" height="92" rx="6"/>
      <rect x="1332" y="58" width="100" height="92" rx="6"/>
      <rect x="1440" y="58" width="100" height="92" rx="6"/>
    </g>
    <g fill="#e2e8f0">
      <rect x="1232" y="66" width="84" height="34" rx="4"/>
      <rect x="1232" y="108" width="84" height="34" rx="4"/>
      <rect x="1340" y="66" width="84" height="34" rx="4"/>
      <rect x="1448" y="66" width="84" height="34" rx="4"/>
      <rect x="1448" y="108" width="84" height="34" rx="4"/>
    </g>
    <rect x="1232" y="66" width="5" height="34" rx="2" fill="#60a5fa"/>
    <rect x="1232" y="108" width="5" height="34" rx="2" fill="#f87171"/>
    <rect x="1340" y="66" width="5" height="34" rx="2" fill="#f87171"/>
    <rect x="1448" y="66" width="5" height="34" rx="2" fill="#60a5fa"/>
    <rect x="1448" y="108" width="5" height="34" rx="2" fill="#4ade80"/>
    <g fill="#94a3b8">
      <rect x="1245" y="76" width="60" height="5" rx="2.5"/>
      <rect x="1245" y="86" width="40" height="5" rx="2.5"/>
      <rect x="1245" y="118" width="54" height="5" rx="2.5"/>
      <rect x="1245" y="128" width="36" height="5" rx="2.5"/>
      <rect x="1353" y="76" width="58" height="5" rx="2.5"/>
      <rect x="1353" y="86" width="44" height="5" rx="2.5"/>
      <rect x="1461" y="76" width="60" height="5" rx="2.5"/>
      <rect x="1461" y="86" width="38" height="5" rx="2.5"/>
      <rect x="1461" y="118" width="52" height="5" rx="2.5"/>
      <rect x="1461" y="128" width="42" height="5" rx="2.5"/>
    </g>
    <text class="label" x="1382" y="190">Azure DevOps work items</text>
  </g>

  <!-- Flows into the engine -->
  <g class="flow">
    <path d="M678,206 C678,236 950,226 950,253" stroke="#fbbf24" marker-end="url(#headAmber)"/>
    <path d="M886,206 C886,236 1030,226 1030,253" stroke="#22d3ee" marker-end="url(#headCyan)"/>
    <path d="M1094,206 C1094,236 1110,226 1110,253" stroke="#f472b6" marker-end="url(#headPink)"/>
    <path d="M1382,206 C1382,236 1190,226 1190,253" stroke="#60a5fa" marker-end="url(#headBlue)"/>
  </g>
  <g stroke="#0a1022" stroke-width="2">
    <circle cx="678" cy="206" r="5" fill="#fbbf24"/>
    <circle cx="886" cy="206" r="5" fill="#22d3ee"/>
    <circle cx="1094" cy="206" r="5" fill="#f472b6"/>
    <circle cx="1382" cy="206" r="5" fill="#60a5fa"/>
  </g>
  <!-- The engine -->
  <rect x="860" y="262" width="420" height="64" rx="32" fill="url(#brand)" opacity="0.55" filter="url(#blur)"/>
  <rect x="860" y="262" width="420" height="64" rx="32" fill="url(#engineFill)" stroke="url(#brand)" stroke-width="2.5"/>
  <rect x="884" y="276" width="36" height="36" rx="9" fill="url(#brand)"/>
  <path d="M893 282 L906 282 L912 288 L912 306 L893 306 Z" fill="#ffffff"/>
  <g fill="#7c3aed">
    <rect x="897" y="290" width="11" height="2.5" rx="1.2"/>
    <rect x="897" y="295" width="11" height="2.5" rx="1.2"/>
    <rect x="897" y="300" width="7" height="2.5" rx="1.2"/>
  </g>
  <text class="engine" x="936" y="305">buildmark</text>
  <line x1="1120" y1="278" x2="1120" y2="310" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <text class="api" x="1140" y="303">.NET tool</text>

  <!-- Flows out of the engine -->
  <g class="flow" stroke="#5eead4">
    <path d="M980,330 C980,356 728,356 728,381" marker-end="url(#headMint)"/>
    <path d="M1040,330 C1040,356 999,356 999,381" marker-end="url(#headMint)"/>
    <path d="M1100,330 C1100,356 1232,356 1232,381" marker-end="url(#headMint)"/>
    <path d="M1160,330 C1160,356 1457,356 1457,381" marker-end="url(#headMint)"/>
  </g>
  <g fill="#5eead4" stroke="#0a1022" stroke-width="2">
    <circle cx="980" cy="330" r="5"/>
    <circle cx="1040" cy="330" r="5"/>
    <circle cx="1100" cy="330" r="5"/>
    <circle cx="1160" cy="330" r="5"/>
  </g>

  <!-- Output tiles -->
  <g>
    <!-- Markdown build notes with their sections -->
    <rect class="card" x="580" y="390" width="296" height="210" rx="16"/>
    <rect class="panel" x="588" y="398" width="280" height="152" rx="10"/>
    <path class="page" d="M604 406 L834 406 L852 424 L852 542 L604 542 Z"/>
    <path d="M834 406 L834 424 L852 424 Z" fill="#cbd5e1"/>
    <text class="mini" x="618" y="433" fill="#7c3aed">#</text>
    <text class="mini ink" x="640" y="433">Changes</text>
    <rect class="bar" x="750" y="424" width="80" height="6" rx="3"/>
    <text class="mini" x="618" y="477" fill="#7c3aed">#</text>
    <text class="mini ink" x="640" y="477">Bugs Fixed</text>
    <rect class="bar" x="774" y="468" width="56" height="6" rx="3"/>
    <text class="mini" x="618" y="521" fill="#7c3aed">#</text>
    <text class="mini ink" x="640" y="521">Known Issues</text>
    <rect class="bar" x="802" y="512" width="28" height="6" rx="3"/>
    <text class="label" x="728" y="585">Markdown notes</text>

    <!-- A PDF document made by Pandoc -->
    <rect class="card" x="889" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="897" y="398" width="204" height="152" rx="10"/>
    <path class="page" d="M952 408 L1034 408 L1050 424 L1050 542 L952 542 Z"/>
    <path d="M1034 408 L1034 424 L1050 424 Z" fill="#cbd5e1"/>
    <rect x="964" y="420" width="50" height="8" rx="4" fill="#4f46e5"/>
    <rect class="bar" x="964" y="436" width="72" height="5" rx="2.5"/>
    <rect class="bar" x="964" y="446" width="60" height="5" rx="2.5"/>
    <rect class="bar" x="964" y="456" width="68" height="5" rx="2.5"/>
    <rect class="bar" x="964" y="466" width="50" height="5" rx="2.5"/>
    <rect x="928" y="486" width="64" height="34" rx="6" fill="#ef4444" filter="url(#paper)"/>
    <text class="mini" x="960" y="511" fill="#ffffff" text-anchor="middle">PDF</text>
    <rect class="bar" x="1004" y="500" width="34" height="5" rx="2.5"/>
    <rect class="bar" x="964" y="528" width="64" height="5" rx="2.5"/>
    <text class="label" x="999" y="585">Pandoc PDF</text>

    <!-- A release with its notes -->
    <rect class="card" x="1122" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="1130" y="398" width="204" height="152" rx="10"/>
    <text class="mini" x="1146" y="436" fill="#f8fafc">v1.2.3</text>
    <rect x="1236" y="414" width="84" height="30" rx="15" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-width="1.5"/>
    <text class="mini" x="1278" y="436" fill="#bbf7d0" text-anchor="middle">Latest</text>
    <line x1="1146" y1="456" x2="1318" y2="456" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="1152" cy="478" r="5" fill="#60a5fa"/>
    <rect class="bar" x="1166" y="474" width="130" height="8" rx="4" fill-opacity="0.75"/>
    <circle cx="1152" cy="504" r="5" fill="#f472b6"/>
    <rect class="bar" x="1166" y="500" width="104" height="8" rx="4" fill-opacity="0.75"/>
    <circle cx="1152" cy="530" r="5" fill="#fbbf24"/>
    <rect class="bar" x="1166" y="526" width="118" height="8" rx="4" fill-opacity="0.75"/>
    <text class="label" x="1232" y="585">Release notes</text>

    <!-- A CI pipeline that publishes the notes as an artifact -->
    <rect class="card" x="1355" y="390" width="205" height="210" rx="16"/>
    <rect class="panel" x="1363" y="398" width="189" height="152" rx="10"/>
    <line x1="1397" y1="448" x2="1517" y2="448" stroke="#64748b" stroke-width="3"/>
    <circle cx="1397" cy="448" r="17" fill="#22c55e"/>
    <path d="M1389 448 L1395 454 L1405 442" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1457" cy="448" r="17" fill="#22c55e"/>
    <path d="M1449 448 L1455 454 L1465 442" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1517" cy="448" r="17" fill="url(#brand)"/>
    <path d="M1510 438 L1520 438 L1525 443 L1525 458 L1510 458 Z" fill="#ffffff"/>
    <rect x="1385" y="494" width="144" height="38" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5"/>
    <text class="miniMono" x="1457" y="520" fill="#e2e8f0" text-anchor="middle">notes.md</text>
    <text class="label" x="1457" y="585">CI pipelines</text>
  </g>
</svg>
