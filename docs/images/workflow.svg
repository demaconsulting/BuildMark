<svg xmlns="http://www.w3.org/2000/svg" width="1044" height="352" viewBox="0 0 1044 352" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <!-- Transparent canvas; a white rounded card keeps the diagram readable in light and dark themes -->
  <rect x="14" y="16" width="1020" height="330" rx="28" fill="#d5dce6"/>
  <rect x="10" y="10" width="1020" height="330" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g transform="translate(35,34)">
    <!-- Step 1: prepare -->
    <rect x="0" y="0" width="220" height="260" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="30" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">1. Prepare your repo</text>
    <rect x="14" y="46" width="192" height="58" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="110" y="70" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">Version tags</text>
    <text x="110" y="90" font-size="12" fill="#1e40af" text-anchor="middle">tag each release, e.g. v1.2.3</text>
    <rect x="14" y="114" width="192" height="58" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="110" y="138" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#1e3a8a" text-anchor="middle">.buildmark.yaml</text>
    <text x="110" y="158" font-size="12" fill="#1e40af" text-anchor="middle">connector, sections, rules</text>
    <rect x="14" y="182" width="192" height="58" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="110" y="206" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">Access token</text>
    <text x="110" y="226" font-size="12" fill="#1e40af" text-anchor="middle">from environment variables</text>

    <line x1="224" y1="130" x2="246" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 2: run -->
    <rect x="250" y="0" width="220" height="260" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="360" y="30" font-size="16" font-weight="600" fill="#92400e" text-anchor="middle">2. Run BuildMark</text>
    <rect x="264" y="46" width="192" height="58" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="360" y="70" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">buildmark CLI</text>
    <text x="360" y="90" font-size="12" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">--build-version --report</text>
    <rect x="264" y="114" width="192" height="58" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="360" y="138" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">CI pipeline</text>
    <text x="360" y="158" font-size="12" fill="#92400e" text-anchor="middle">GitHub Actions, Azure Pipelines</text>
    <rect x="264" y="182" width="192" height="58" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="360" y="206" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">--lint</text>
    <text x="360" y="226" font-size="12" fill="#92400e" text-anchor="middle">check the configuration file</text>

    <line x1="474" y1="130" x2="496" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 3: build notes -->
    <rect x="500" y="0" width="220" height="260" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="610" y="30" font-size="16" font-weight="600" fill="#5b21b6" text-anchor="middle">3. Get build notes</text>
    <rect x="514" y="46" width="192" height="58" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="610" y="70" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#4c1d95" text-anchor="middle">build-notes.md</text>
    <text x="610" y="90" font-size="12" fill="#5b21b6" text-anchor="middle">versions and commit hashes</text>
    <rect x="514" y="114" width="192" height="58" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="610" y="138" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Routed sections</text>
    <text x="610" y="158" font-size="12" fill="#5b21b6" text-anchor="middle">Changes, Bugs Fixed, ...</text>
    <rect x="514" y="182" width="192" height="58" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="610" y="206" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Known issues</text>
    <text x="610" y="226" font-size="12" font-family="Consolas, monospace" fill="#5b21b6" text-anchor="middle">--include-known-issues</text>

    <line x1="724" y1="130" x2="746" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 4: use -->
    <rect x="750" y="0" width="220" height="260" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="860" y="30" font-size="16" font-weight="600" fill="#166534" text-anchor="middle">4. Use them</text>
    <rect x="764" y="46" width="192" height="58" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="860" y="70" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Release notes</text>
    <text x="860" y="90" font-size="12" fill="#166534" text-anchor="middle">generated for every release</text>
    <rect x="764" y="114" width="192" height="58" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="860" y="138" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Build artifacts</text>
    <text x="860" y="158" font-size="12" fill="#166534" text-anchor="middle">kept for historical tracking</text>
    <rect x="764" y="182" width="192" height="58" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="860" y="206" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Larger documents</text>
    <text x="860" y="226" font-size="12" fill="#166534" text-anchor="middle">heading level via --depth</text>

    <text x="485" y="290" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">Need tool qualification evidence? Run buildmark --validate --results validation-results.trx</text>
  </g>
</svg>
